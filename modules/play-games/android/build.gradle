plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.playgames'
version = '0.1.0'

android {
  namespace "expo.modules.playgames"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

repositories {
  mavenCentral()
}

dependencies {
  // Google Play Games Services v2 — the achievements + sign-in client this
  // module wraps. Same version the withPlayGames config plugin links into the
  // app AAB; Gradle dedupes when both are present.
  implementation 'com.google.android.gms:play-services-games-v2:21.0.0'
}
