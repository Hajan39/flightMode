name: Static analysis

# Static review for every pull request (no AI tokens, no secrets):
# - CodeQL: GitHub code scanning for JavaScript/TypeScript (security +
#   quality queries); results appear on the PR and under Security.
# - Dependency review: fails a PR that adds or upgrades a dependency with a
#   known high/critical vulnerability.
# Human-like review comments come from GitHub Copilot code review, which is
# enabled in the repository settings and follows .github/copilot-instructions.md.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC — catches new advisories
  workflow_dispatch:

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
          config: |
            paths-ignore:
              - node_modules
              - dist-e2e
              - content
              - docs/img

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
