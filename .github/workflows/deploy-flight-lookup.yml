name: Deploy Flight Lookup Worker

# Deploys services/flight-lookup (Cloudflare Worker) — independent of the app
# release (release-main.yml ignores services/**). Until the owner adds the
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets and the KV
# namespace id, the job type-checks and then skips the deploy with a notice
# instead of failing. Setup: services/flight-lookup/README.md.

on:
  push:
    branches:
      - main
    paths:
      - 'services/flight-lookup/**'
      - '.github/workflows/deploy-flight-lookup.yml'
  workflow_dispatch:

concurrency:
  group: deploy-flight-lookup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Type-check & deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/flight-lookup
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: services/flight-lookup/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Type-check Worker
        run: npm run typecheck

      - name: Check deploy configuration
        id: config
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          KV_ID: ${{ vars.FLIGHT_LOOKUP_KV_ID }}
        run: |
          ready=true
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::notice title=Flight lookup not deployed::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see services/flight-lookup/README.md)."
            ready=false
          fi
          if [ -n "$KV_ID" ]; then
            if ! printf '%s' "$KV_ID" | grep -Eq '^[0-9a-f]{32}$'; then
              echo "::error title=Invalid FLIGHT_LOOKUP_KV_ID::The repository variable must be the 32-character KV namespace ID."
              exit 1
            fi
            sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/$KV_ID/" wrangler.toml
          fi
          if grep -q 'REPLACE_WITH_KV_NAMESPACE_ID' wrangler.toml; then
            echo "::notice title=Flight lookup not deployed::Set the FLIGHT_LOOKUP_KV_ID repository variable (or the id in wrangler.toml) to the KV namespace ID."
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        if: steps.config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/flight-lookup
          wranglerVersion: '4.156.0'
          command: deploy
